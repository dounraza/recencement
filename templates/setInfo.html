{% extends "base.html" %}
{% block title %} CPP-SYSTEM MADAGASCAR {% endblock %}

{% block content %}
    {% include "proprio.html" %}
    <hr/>
    {% include "chauffeur.html" %}
    <hr/>
    {% include "receveur.html" %}
    <hr/>
    {% include "vehicule.html" %}
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script>


            $('#sendInfo').on('click', function() {
            var x = document.getElementById("proprio");
            x.style.display = "none";
            });

     
//proprio begin 
                $(".radio-group .radio").on("click", function () {
                $(".selected .fa").removeClass("fa-check");
                $(".radio").removeClass("selected");
                $(this).addClass("selected");
                if ($("#suser").hasClass("selected") == true) {
                    $(".next").prop("disabled", true);
                    $(".searchfield").show();
                } else {
                    setFormFields(false);
                    $(".next").prop("disabled", false);
                    $("#filter-records").html("");
                    $(".searchfield").hide();
                }
                });
                var step = 1;
                $(document).ready(function () { stepProgress(step); });

                $(".next").on("click", function () {
                var nextstep = false;
                if (step == 2) {
                    nextstep = checkForm("userinfo");
                } else {
                    nextstep = true;
                }
                if (nextstep == true) {
                    if (step < $(".step").length) {
                    $(".step").show();
                    $(".step")
                        .not(":eq(" + step++ + ")")
                        .hide();
                    stepProgress(step);
                    }
                    hideButtons(step);
                }
                });

                // ON CLICK BACK BUTTON
                $(".back").on("click", function () {
                if (step > 1) {
                    step = step - 2;
                    $(".next").trigger("click");
                }
                hideButtons(step);
                });

                // CALCULATE PROGRESS BAR
                stepProgress = function (currstep) {
                var percent = parseFloat(100 / $(".step").length) * currstep;
                percent = percent.toFixed();
                $(".progress-bar")
                    .css("width", percent + "%")
                    .html(percent + "%");
                };

                // DISPLAY AND HIDE "NEXT", "BACK" AND "SUMBIT" BUTTONS
                hideButtons = function (step) {
                var limit = parseInt($(".step").length);
                $(".action").hide();
                if (step < limit) {
                    $(".next").show();
                }
                if (step > 1) {
                    $(".back").show();
                }
                if (step == limit) {
                    $(".next").hide();
                    $(".submit").show();
                }
                };

                

                function checkForm(val) {
                // CHECK IF ALL "REQUIRED" FIELD ALL FILLED IN
                var valid = true;
                $("#" + val + " input:required").each(function () {
                    if ($(this).val() === "") {
                    $(this).addClass("is-invalid");
                    valid = false;
                    } else {
                    $(this).removeClass("is-invalid");
                    }
                });
                return valid;
                }
    //proprio end

    //chauffeur  begin
   
    //chauffeur end

    </script>
{% endblock %}
