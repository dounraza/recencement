{% extends "base.html" %}
{% block title %}CPP-SYSTEM | SMS Service {% endblock %}

{% block content %}
<style>
    #sendSms_filter{
        margin-left: 58%;
        margin-top: -4.2em;
    }
    .pagination{
        margin-left: 68%;
    }
</style>
<hr/>
<h4>BATCH SMS CPP-SYSTEM <a href="{{url_for('dashboard')}}" class="btn btn-xs btn-danger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5z"/>
  </svg></a>  <a href="#" class="btn btn-xs btn-warning"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
  </svg>  Send All Sms</a></h4>
  

<table class="table table-dark " id="sendSms" width="100%">
    <thead>
      <tr>
        
        <th >Véhicule</th>
        <th >Propriétaire</th>
        <th >Type</th>
        <th >Status</th>
        <th >Action</th>
      </tr>
    </thead>
    <tbody>
    {% for item in data %}
      <tr>
       <td>{{item.vehicule}}</td>
        <td>{{item.vehicule}}</td>
        <td>{{item.type}}</td>
        <td class="text-danger">{{item.status}}</td>
        <td ><a href="#" class="senduni" data-vehic="{{item.vehicule}}" data-type="{{item.type}}"><i class="fa fa-envelope"></i></a></td>
      </tr>
    {% endfor %}
   
    </tbody>
  </table>
  
  <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
  <script>
    $(document).ready(function () {
    $('#sendSms').DataTable();
    });
    $( ".senduni" ).on( "click", function() {
      var vehicule = $(this).data('vehic');
      var type = $(this).data('type');
      sendSmsToClient(vehicule,type);
      });
    
     function  sendSmsToClient(dd,df)
       {
         uri="/sendSmsToProprio";
             $.ajax({
               type: 'POST',
               url:uri,
               async: true,
               data: {'vehic':dd,'type':df},
               datatype:"html",
               success: function(text) {
                //  $('#js-text').removeClass('hidden');
                //  $('#js-text').val(text);
                //  $("#extraire").text("Extraire");
                    if(text=='success') {
                        $('.seafile1').removeClass('text-success');
                        $('.seafile1').addClass('bg-soft-success text-success');
                        $('.seafile1').text('Good');
                    }
                    if(text=='failed') {
                        $('.seafile1').removeClass('text-success');
                        $('.seafile1').addClass('bg-soft-danger text-danger');
                        $('.seafile1').text('Lost');
                    }
               },
     
               error: function(e) {
                 console.log(e);
                //  $("#extraire").text("Extraire");
               }
     
             });
       }
</script>
{% endblock %}
