<fieldset>
    
    <div class="spinner-border text-danger" id="spinnvehicule"role="status" style="display:none">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h2 class="fs-title">Details Bus</h2>
    <h3 class="fs-subtitle">Recensement ou pointage de bus <p id="plaque_name" class="plaque_name"> </p> </h3>
    <input type="hidden" name="plaque" id="plaque">
    <h5 id="devant" style="display:none;"><span class="pull-left text-primary">Devant du véhicule</span></h5>
    <img id="devant_vehicule" alt="your image" width="100" height="100" />
    <input type="file" onchange="document.getElementById('devant_vehicule').src = window.URL.createObjectURL(this.files[0])" name="devant_vehicule" id="devant_vehicule1">
    <textarea name="data_response" id="data_response" rows="5" cols="15"style="display:none"></textarea>

    <input type="text"  name="plaque_im" id="plaque_im" value="" placeholder="Plaque d'immatriculation Vehicule">
    <input type="text"  name="marque" id="marque" value="" placeholder="Marque Vehicule">
    
    <input type="number"  name="nbplc_vehic" id="nbplc_vehic" value="" min="18" min="32" placeholder="Nombre de place Vehicule">
    <div class="row">
        <label for="el_ext_vehic">Elligibilité pub exterieur</label>
        <input type="checkbox"  name="el_ext_vehic" id="el_ext_vehic" value="" placeholder="">
        <label for="el_int_vehic">Elligibilité pub intérieur</label>
        <input type="checkbox"  name="el_int_vehic" id="el_int_vehic" value="" placeholder="">
    </div>
    
    <select name="cooperative" id="cooperative"class="form-select">
            <option value="">Ligne</option>
            {% for item in record %}
            <option value="{{item.variance}}">{{item.nom}}</option>
            {% endfor %}
            <!-- <option value="KOFIAMA">KOFIAMA</option>
            <option value="FIFIABE">FIFIABE</option> -->
   </select>
   <input type="hidden"  name="username" id="username" value="{{username}}">
   <input type="hidden"  name="userid" id="userid" value="{{userid}}">
  
    <a href="#"  class="btn btn-xs btn-success" id="check" >Check Info</a>
    
    <div id="action_btn" class="mt-3" style="display: block;">
            <a href="#"  class="btn btn-xs btn-primary" id="Pointage" >Pointage</a>
            <a href="#"  class="btn btn-xs btn-dark" id="nextrecensement" >Recensement</a>
            
    </div>
    <div id="gallery" style="display: none;">
    <h5><span class="pull-left text-primary">Derrière du véhicule</span></h5>
          <img id="derriere_vehicule" alt="your image" width="100" height="100" />
          <input type="file" onchange="previewImage(this)" name="derriere_vehicule" id="derriere_vehicule1">
    <h5><span class="pull-left text-primary">Coté gauche du véhicule</span></h5>
        <img id="gauche_vehicule" alt="your image" width="100" height="100" />
        <input type="file"onchange="previewImage(this)" name="gauche_vehicule" id="gauche_vehicule1">
    <h5><span class="pull-left text-primary">Coté droite du véhicule</span></h5>
        <img id="droite_vehicule" alt="your image" width="100" height="100" />
         <input type="file"onchange="previewImage(this)" name="droite_vehicule" id="droite_vehicule1">
    <h5> <span class="pull-left text-primary">Intérieur du véhicule</span></h5>
         <img id="interieur_vehicule" alt="your image" width="100" height="100" />
        <input type="file"onchange="previewImage(this)" name="interieur_vehicule" id="interieur_vehicule1">
   
   </div>
   
    <a href="#"  class="btn btn-xs btn-danger" id="terminer_vehicule" style="display:none">Envoyer</a>
    <input type="button" name="next" class="next btn-xs action-button pull-right" id="continuer"style="display:none" value="Continuer"/>


</fieldset>
