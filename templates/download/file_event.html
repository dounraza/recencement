<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste Files</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery 1.9.1 -->
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <!-- DataTables CSS -->
  <link href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap.min.css" rel="stylesheet">
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">
  
</head>
<body>
   
    <div class="container mt-5">
        <div class="pull-left"><a href="{{url_for('dashboard')}}" class="btn btn-xs btn-dark"> <i class="fa fa-home"></i> Home </a>&nbsp </div>
    <table id="myTable" class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Date</th>
        <!-- <th scope="col">Location</th> -->
        <th scope="col">Nom de Fichier</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
        {% for item in record %}
        <tr>
          <td>#</td>
          <!-- <td>{{item[0]}}</td>
          <td>{{item[1]}}</td>
      
          <td class="text-danger">{{item[3]}}</td> -->
          <td>{{item["date"]}}</td>
          <td>{{item["nom_fichier"]}}</td>
        
           <td>
            <a href="/telecharger/{{item["nom_fichier"]}}" > <i class="fa fa-file-excel-o"></i></a>
         </td>
        </tr>
    {% endfor %}
      <!-- Add more rows as needed -->
    </tbody>
  </table>
</div>
  <script>
    $(document).ready(function() {
      $('#myTable').DataTable();
    });
  </script>
</body>
</html>
